// ---------- search ----------
const toLatinDigits = (s) => s.replace(/[٠-٩]/g, (d) => d.charCodeAt(0) - 0x660).replace(/[۰-۹]/g, (d) => d.charCodeAt(0) - 0x6f0);

  const latin = [tr, tr.replace(ARTICLE, ""), ...al.filter((x) => !/[\u0600-\u06FF]/.test(x))].map(latinKey);

const subseq = (q, k) => { let i = 0; for (const c of k) if (c === q[i]) i++; return i === q.length; };

// Parse free text like "mulk 11-20", "67:1-10", "الملك ١-١٠", "surah 36". Returns {text, from, to}.
function parseQuery(raw) {
  let q = toLatinDigits(raw).replace(/\b(surah|surat|sura)\b|سورة|سوره/gi, " ").trim();
  let from = null, to = null;
  const m = q.match(/(?:[\s:.,]+|^)(\d{1,3})\s*(?:-|–|—|to|الى|إلى)\s*(\d{1,3})\s*$/i) || q.match(/[:.]\s*(\d{1,3})\s*$/);

function searchSurahs(raw, limit = 8) {

    return out;

  const qa = arKey(text), qaNoAl = arNoAl(qa), ql = latinKey(text.replace(ARTICLE, "")), qlFull = latinKey(text);

  for (const e of INDEX) {
    let score = 0;
    if (isAr) {

        if (k === qa || k === qaNoAl) score = Math.max(score, 100);
        else if (k.startsWith(qa) || k.startsWith(qaNoAl)) score = Math.max(score, 80);
        else if (qaNoAl.length > 1 && k.includes(qaNoAl)) score = Math.max(score, 50);
      }

      for (const k of e.latin) {
        if (k === ql || k === qlFull) score = Math.max(score, 100);
        else if (k.startsWith(ql) || k.startsWith(qlFull)) score = Math.max(score, 85);
        else if (ql.length >= 3 && k.includes(ql)) score = Math.max(score, 55);
        else if (ql.length >= 4 && subseq(ql, k)) score = Math.max(score, 20);
      }
      const qw = text.toLowerCase().replace(/^the\s+/, "");
      if (qw.length >= 3 && e.english.some((w) => w.startsWith(qw))) score = Math.max(score, 60);
    }
    if (score) scored.push([score, e.s]);
  }
  return scored.sort((a, b) => b[0] - a[0] || a[1] - b[1]).slice(0, limit).map((x) => x[1]);
}

  input.addEventListener("blur", () => setTimeout(close, 120));
  list.addEventListener("mousedown", (e) => e.preventDefault());
  list.addEventListener("click", (e) => { const li = e.target.closest("[data-s]"); if (li) pick(+li.dataset.s); });
  return {
    get value() { return chosen; },
    set(s) { if (!s) { chosen = null; input.value = ""; el.classList.remove("chosen"); return; } chosen = s; input.value = `${s}. ${sName(s)} — ${sArabic(s)}`; el.classList.add("chosen"); },
    focus() { input.focus(); }, input,
  };
}

// ---------- shared assessment block (grade + mistake counters + note) ----------
const GRADES = [["excellent", "Excellent", "ممتاز"], ["verygood", "Very good", "جيد جدا"], ["good", "Good", "جيد"], ["repeat", "Repeat", "إعادة"]];
const gradeLabel = (g) => GRADES.find((x) => x[0] === g)?.[1] || "";
function assessmentBlock() {
  return `<fieldset class="assess"><legend>Ustad's assessment</legend>
    <div class="seg grade" role="radiogroup" aria-label="Grade">${GRADES.map(([v, en, ar], i) =>
      `<label class="seg-opt g-${v}"><input type="radio" name="grade" value="${v}" ${i === 0 ? "checked" : ""}><span>${en}<small lang="ar">${ar}</small></span></label>`).join("")}</div>
    <div class="counters">
      ${[["memory", "Memory mistakes", "أخطاء الحفظ"], ["tajweed", "Tajweed mistakes", "أخطاء التجويد"], ["prompts", "Prompts given", "تلقين"]].map(([k, en, ar]) => `
      <div class="counter" data-k="${k}"><span class="c-label">${en}<small lang="ar">${ar}</small></span>
        <button type="button" class="c-btn" data-d="-1" aria-label="Decrease ${en}">−</button>
        <output name="m_${k}">0</output>
        <button type="button" class="c-btn" data-d="1" aria-label="Increase ${en}">+</button></div>`).join("")}
    </div>
    <label>Note for this reading <span class="opt">(optional)</span><input name="note" maxlength="300" placeholder="e.g. hesitant at ayah 14, revise before next lesson"></label>
  </fieldset>`;
}
function wireAssessment(form) {
  form.querySelectorAll(".counter").forEach((c) => c.querySelectorAll(".c-btn").forEach((b) => (b.onclick = () => {
    const o = c.querySelector("output"); o.value = Math.max(0, Math.min(99, Number(o.value) + Number(b.dataset.d)));
  })));
  return () => ({
    grade: form.querySelector("input[name=grade]:checked")?.value || "",
    mistakes: Object.fromEntries([...form.querySelectorAll(".counter")].map((c) => [c.dataset.k, Number(c.querySelector("output").value)])),
    note: form.note.value.trim().slice(0, 300),
  });
}
const assessSummary = (e) => {
  if (!e.grade && !e.mistakes) return "";
  const m = e.mistakes || {}, bits = [];
  if (m.memory) bits.push(`${m.memory} memory`); if (m.tajweed) bits.push(`${m.tajweed} tajweed`); if (m.prompts) bits.push(`${m.prompts} prompts`);
  return [gradeLabel(e.grade), bits.length ? bits.join(", ") : "no mistakes"].filter(Boolean).join(" · ");
};

// ---------- portion editor: one reading portion (ayah / page / surah range) ----------
const MODE_LABEL = { ayah: "Ayah to ayah", page: "Page to page", surah: "Surah to surah" };
const stepper = (name, label, min, max, val) => `<label class="st-label">${label}
  <span class="stepper"><button type="button" class="st-btn" data-for="${name}" data-d="-1" aria-label="${label} minus one">−</button><input type="number" name="${name}" min="${min}" max="${max}" value="${val}" inputmode="numeric" aria-label="${label}"><button type="button" class="st-btn" data-for="${name}" data-d="1" aria-label="${label} plus one">+</button></span></label>`;

function portionEditor(root, { modes, onChange, index, startFor }) {
  let mode = modes[0], s = null, s2 = null;
  const pid = `p${++acSeq}`;
  root.className = "portion";
  const render = () => {
    root.innerHTML = `<div class="portion-head"><span class="portion-no">Portion ${index()}</span>
        <div class="seg mode" role="radiogroup" aria-label="Capture by">${modes.map((m) => `<label class="seg-opt"><input type="radio" name="${pid}-mode" value="${m}" ${m === mode ? "checked" : ""}><span>${MODE_LABEL[m]}</span></label>`).join("")}</div>
        <button type="button" class="icon-btn small danger p-remove" aria-label="Remove portion">${icon("x")}</button></div>
      ${mode === "ayah" ? `<div class="ac-slot" data-k="s"></div><div class="range-2">${stepper("from", "From ayah", 1, 286, 1)}${stepper("to", "To ayah", 1, 286, 1)}</div>` : ""}
      ${mode === "page" ? `<div class="ac-slot" data-k="s" data-hint="page"></div><div class="range-2">${stepper("from", "From page", 1, 604, 1)}${stepper("to", "To page", 1, 604, 1)}</div>` : ""}
      ${mode === "surah" ? `<div class="range-2 ac-2"><div><span class="st-label">From surah</span><div class="ac-slot" data-k="s"></div></div><div><span class="st-label">To surah</span><div class="ac-slot" data-k="s2"></div></div></div>` : ""}
      <p class="portion-sum" aria-live="polite"></p>`;
    const q = (n) => root.querySelector(`input[name=${n}]`);
    root.querySelectorAll(`input[name=${pid}-mode]`).forEach((r) => (r.onchange = () => { mode = r.value; s = s2 = null; render(); onChange(); }));
    root.querySelectorAll(".st-btn").forEach((b) => (b.onclick = () => { const i = q(b.dataset.for); i.value = clampTo(Number(i.value) + Number(b.dataset.d), i); if (b.dataset.for === "from") syncTo(); refresh(); }));
    root.querySelectorAll(".stepper input").forEach((i) => { i.oninput = refresh; i.onfocus = () => i.select(); i.onmouseup = (e) => e.preventDefault(); i.onchange = () => { i.value = clampTo(i.value, i); if (i.name === "from") syncTo(); refresh(); }; });
    root.querySelectorAll(".ac-slot").forEach((slot) => {
      const k = slot.dataset.k;
      const ac = surahAutocomplete(slot, {
        placeholder: slot.dataset.hint ? "Optional: type a surah to jump to its pages" : k === "s2" ? "Same as from surah" : undefined,
        label: k === "s2" ? "To surah" : "Surah",
        onPick: ({ s: picked, from, to }) => {
          if (k === "s2") s2 = picked; else s = picked;
          if (mode === "ayah") {
            const n = sCount(picked), f = from || Math.min(n, startFor?.(picked) || 1), t = to || Math.min(n, f + 4);
            q("from").max = q("to").max = n; q("from").value = f; q("to").value = Math.max(f, t);
            if (!from) { q("to").focus(); q("to").select(); }
          }
          if (mode === "page") { const [a1, a2] = surahRange(picked, picked); q("from").value = pageOf(a1); q("to").value = pageOf(a2); }
          refresh();
        },
        onClear: () => { if (k === "s2") s2 = null; else s = null; refresh(); },
      });
      root[`_${k}`] = ac;
    });
    refresh();
  };
  const clampTo = (v, i) => Math.max(Number(i.min), Math.min(Number(i.max), Math.round(Number(v)) || Number(i.min)));
  const syncTo = () => { const f = root.querySelector("input[name=from]"), t = root.querySelector("input[name=to]"); if (Number(t.value) < Number(f.value)) t.value = f.value; };
  const get = () => {
    const f = Number(root.querySelector("input[name=from]")?.value), t = Number(root.querySelector("input[name=to]")?.value);
    if (mode === "ayah") {
      if (!s) return { mode, error: "Choose a surah" };
      if (!(f >= 1 && t >= f && t <= sCount(s))) return { mode, error: `Ayahs must be 1–${sCount(s)}, with “to” not before “from”` };
      return { mode, s, from: f, to: t, a1: aid(s, f), a2: aid(s, t) };
    }
    if (mode === "page") {
      if (!(f >= 1 && t >= f && t <= TOTAL_PAGES)) return { mode, error: "Pages must be 1–604, with “to” not before “from”" };
      const [a1, a2] = pageRange(f, t); return { mode, from: f, to: t, a1, a2 };
    }
    if (!s) return { mode, error: "Choose the first surah" };
    const last = s2 || s, [a1, a2] = surahRange(s, last);
    return { mode, from: s, to: last, a1, a2 };
  };
  const refresh = () => {
    const g = get(), out = root.querySelector(".portion-sum");
    if (g.error) { out.className = `portion-sum ${/^Choose/.test(g.error) ? "hint" : "warn"}`; out.textContent = /^Choose/.test(g.error) ? "Start typing a surah name, number or Arabic name above" : g.error; }
    else { const d = describe(g.a1, g.a2); out.className = "portion-sum ok"; out.innerHTML = `<strong>${esc(d.text)}</strong> · ${d.ayahs} ayah${d.ayahs === 1 ? "" : "s"} · ${d.pages} · ${d.juz}`; }
    onChange();
  };
  // Pre-fill (used by "continue from last").
  const set = (v) => {
    mode = v.mode; render();
    const q = (n) => root.querySelector(`input[name=${n}]`);
    if (v.mode === "ayah") { s = v.s; root._s.set(v.s); ["from", "to"].forEach((f) => (q(f).max = sCount(v.s))); q("from").value = v.from; q("to").value = v.to; }
    if (v.mode === "page") { q("from").value = v.from; q("to").value = v.to; }
    if (v.mode === "surah") { s = v.from; s2 = v.to; root._s.set(v.from); root._s2.set(v.to); }
    refresh();
  };
  render();
  return { get, set, root, focus: () => root.querySelector(".ac input, .stepper input")?.focus() };
}

// Manages a list of portions with Add / Remove.
function portionList(container, addBtn, modes, onChange, startFor) {
  const editors = [];
  const renumber = () => editors.forEach((e, i) => { const n = e.root.querySelector(".portion-no"); if (n) n.textContent = `Portion ${i + 1}`; e.root.querySelector(".p-remove").hidden = editors.length === 1; });
  const add = (preset) => {
    const div = document.createElement("div"); container.append(div);
    let ed = null;
    ed = portionEditor(div, { modes, startFor, onChange: () => onChange?.(), index: () => (ed ? editors.indexOf(ed) + 1 : editors.length + 1) });
    editors.push(ed);
    div.addEventListener("click", (e) => { if (e.target.closest(".p-remove") && editors.length > 1) { editors.splice(editors.indexOf(ed), 1); div.remove(); renumber(); onChange?.(); } });
    if (preset) ed.set(preset);
    renumber(); onChange?.();
    return ed;
  };
  addBtn.onclick = () => add().focus();
  add();
  return { all: () => editors.map((e) => e.get()), first: () => editors[0], reset: () => { editors.splice(0).forEach((e) => e.root.remove()); add(); } };
}
const portionText = (list) => list.map((p) => describe(p.a1, p.a2).text).join("; ");
</script>
