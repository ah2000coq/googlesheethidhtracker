<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<?!= include('Styles'); ?>
</head>
<body>
<?!= include('Header'); ?>
<main class="wrap content">
<div class="page-head"><h2>Progress history</h2><p class="lead">Every Sunday entry for a student, showing which juz changed and the week-on-week change overall.</p></div>
<div id="picker" class="picker"></div>
<div id="notice" role="status" class="notice" hidden></div>
<div id="main"></div>

<p class="foot">Records are saved in the class Google Sheet. Use <a data-nav="backup">Backup</a> to download a copy.</p>
</main>
<script>const BOOT = <?!= boot ?>;</script>
<?!= include('Common'); ?>
<script>
// ===== Page: Progress history =====
const GRADE_NAMES = { excellent: "Excellent", verygood: "Very good", good: "Good", repeat: "Repeat" };
function assessSummaryH(e) {
  if (!e.grade) return "";
  const m = e.mistakes || {}, bits = [];
  if (m.memory) bits.push(`${m.memory} memory mistake${m.memory > 1 ? "s" : ""}`); if (m.tajweed) bits.push(`${m.tajweed} tajweed mistake${m.tajweed > 1 ? "s" : ""}`); if (m.prompts) bits.push(`${m.prompts} prompt${m.prompts > 1 ? "s" : ""}`);
  return `<span class="g g-${esc(e.grade)}">${GRADE_NAMES[e.grade] || ""}</span> · ${bits.length ? bits.join(", ") : "no mistakes"}`;
}
function chart(list) {
  const pts = [...list].reverse(); if (pts.length < 2) return "";
  const W = 420, H = 170, P = 26, max = Math.max(10, ...pts.map((p) => p.pct));
  const t0 = new Date(pts[0].date).getTime(), t1 = new Date(pts.at(-1).date).getTime() || t0 + 1;
  const x = (d) => P + ((new Date(d).getTime() - t0) / Math.max(1, t1 - t0)) * (W - 2 * P);
  const y = (v) => H - P - (v / max) * (H - 2 * P);
  const line = pts.map((p) => `${x(p.date).toFixed(1)},${y(p.pct).toFixed(1)}`).join(" ");
  return `<div class="chart"><h3>Completion over time</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Completion rose from ${pts[0].pct}% to ${pts.at(-1).pct}%">
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="#d7e3de"/>
    <text x="${P}" y="${H - 8}" font-size="12" fill="#6b7f77">${fmtDate(pts[0].date)}</text>
    <text x="${W - P}" y="${H - 8}" font-size="12" fill="#6b7f77" text-anchor="end">${fmtDate(pts.at(-1).date)}</text>
    <text x="${P}" y="${y(max) - 6}" font-size="12" fill="#6b7f77">${max}%</text>
    <polyline points="${line}" fill="none" stroke="#103d2d" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p) => `<circle cx="${x(p.date).toFixed(1)}" cy="${y(p.pct).toFixed(1)}" r="4" fill="#d5a84b"><title>${fmtDate(p.date)}: ${p.pct}%</title></circle>`).join("")}
  </svg></div>`;
}
function juzChanges(x, older) {
  if (!older) { const set = x.juz.map((v, i) => [i, v]).filter(([, v]) => v > 0); return set.length ? set.map(([i, v]) => `Juz ${i + 1}: ${v}%`).join("<br>") : "—"; }
  const ch = x.juz.map((v, i) => [i, older.juz[i], v]).filter(([, a, b]) => a !== b);
  return ch.length ? ch.map(([i, a, b]) => `Juz ${i + 1}: ${a}% → ${b}%`).join("<br>") : "No change";
}
function refresh() {
  const db = loadDB(), id = param("id");
  if (!studentPicker(db, id, refresh)) return ($("#main").innerHTML = noStudents());
  const s = id && findStudent(db, id);
  if (!s) return ($("#main").innerHTML = `<p class="small-muted">Choose a student to see their Sunday history.</p>`);
  const list = sessionsFor(db, s.id);
  const rows = list.map((x, i) => {
    const older = list[i + 1], ch = older && x.type !== "murajah" ? x.pct - older.pct : null;
    const extra = [assessSummaryH(x), x.note ? esc(x.note) : ""].filter(Boolean).join("<br>");
    const kind = x.type === "hifdh" ? `<span class="kind hifdh">Hifdh</span>` : x.type === "murajah" ? `<span class="kind murajah">Murajah</span>` : "";
    return `<tr><td class="date">${fmtDate(x.date)}${kind}</td><td class="txt">${esc(x.mem) || "—"}${x.type === "hifdh" && extra ? `<small class="assess-line">${extra}</small>` : ""}</td>
      <td class="txt">${esc(x.rev) || "—"}${x.type === "murajah" && extra ? `<small class="assess-line">${extra}</small>` : ""}</td>
      <td class="juz-changes">${juzChanges(x, older)}${x.revJuz.length ? `<br><strong>Revised:</strong> ${x.revJuz.map((i) => `Juz ${i + 1}`).join(", ")}` : ""}</td>
      <td class="r"><span class="progress-pill">${x.pct}%</span></td>
      <td class="r"><span class="change ${ch < 0 ? "neg" : ""}">${ch === null ? "—" : `${ch >= 0 ? "+" : ""}${ch}%`}</span></td>
      <td class="r"><button class="icon-btn small danger" data-del="${x.id}" aria-label="Delete entry for ${fmtDate(x.date)}">${icon("trash")}</button></td></tr>`;
  }).join("");
  $("#main").innerHTML = `<div class="panel wide">
    <div class="summary"><strong style="display:block;margin-bottom:.6rem">${esc(s.name)}</strong>${juzBlock(s.juz, s.revDates)}</div>
    ${chart(list)}
    ${list.length ? `<div class="history-table"><table><thead><tr><th>Sunday date</th><th>New memorisation</th><th>Revision</th><th>Juz updated</th><th class="r">Overall</th><th class="r">Weekly change</th><th><span class="sr" style="position:absolute;left:-9999px">Actions</span></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<p class="center-muted">No Sunday history yet.</p>`}
    <div class="btn-row"><a class="primary-btn" href="${link("progress", { id: s.id })}">${icon("book")} Record hifdh</a>
      <a class="primary-btn" href="${link("murajah", { id: s.id })}">${icon("history")} Record murajah</a>
      <a class="secondary-btn" href="${link("profile", { id: s.id })}">${icon("user")} Profile</a></div></div>`;
  document.querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => {
    if (!(await ask("Delete this Sunday entry?", { ok: "Delete", danger: true }))) return;
    const entryId = Number(b.dataset.del);
    if (!(await busy(b, "…", () => api("deleteSession", entryId)))) return;
    DB.sessions = DB.sessions.filter((x) => x.id !== entryId);
    refresh(); notify("Entry deleted.");
  }));
}
start(refresh);
</script>
</body>
</html>
